# CI: runs the test suite on Gitea runners, under every POSIX shell it can install;
# zsh and fish are there to check the completion scripts parse.
# GitHub sees this file through the mirror; the guard skips it there.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          missing=""
          for t in jq git shellcheck dash busybox zsh fish; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            sudo=$(command -v sudo || true)
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq $missing
          fi
      - name: Test
        run: ./tests/run-tests.sh
